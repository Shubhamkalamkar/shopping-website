<div class="signup-container">
  <div class="signup-card">
    <h2>Sign Up</h2>
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          placeholder="Enter your name"
          [class.error]="signupForm.get('name')?.touched && signupForm.get('name')?.invalid"
        />
        <span class="error-message" *ngIf="signupForm.get('name')?.touched">
          {{ getErrorMessage('name') }}
        </span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.error]="signupForm.get('email')?.touched && signupForm.get('email')?.invalid"
        />
        <span class="error-message" *ngIf="signupForm.get('email')?.touched">
          {{ getErrorMessage('email') }}
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
          [class.error]="signupForm.get('password')?.touched && signupForm.get('password')?.invalid"
        />
        <span class="error-message" *ngIf="signupForm.get('password')?.touched">
          {{ getErrorMessage('password') }}
        </span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          placeholder="Confirm your password"
          [class.error]="signupForm.get('confirmPassword')?.touched && (signupForm.get('confirmPassword')?.invalid || signupForm.errors?.['mismatch'])"
        />
        <span class="error-message" *ngIf="signupForm.get('confirmPassword')?.touched || signupForm.errors?.['mismatch']">
          {{ getErrorMessage('confirmPassword') }}
        </span>
      </div>

      <button type="submit" [disabled]="isSubmitting || signupForm.invalid" class="submit-button">
        {{ isSubmitting ? 'Signing up...' : 'Sign Up' }}
      </button>

      <div class="form-footer">
        <p>Already have an account? <a routerLink="/account/login">Login</a></p>
      </div>
    </form>
  </div>
</div>
