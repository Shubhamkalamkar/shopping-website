<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <span class="error-message" *ngIf="loginForm.get('email')?.touched">
          {{ getErrorMessage('email') }}
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
          [class.error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
        <span class="error-message" *ngIf="loginForm.get('password')?.touched">
          {{ getErrorMessage('password') }}
        </span>
      </div>

      <button type="submit" [disabled]="isSubmitting || loginForm.invalid" class="submit-button">
        {{ isSubmitting ? 'Logging in...' : 'Login' }}
      </button>

      <div class="form-footer">
        <p>Don't have an account? <a routerLink="/account/signup">Sign up</a></p>
      </div>
    </form>
  </div>
</div>
