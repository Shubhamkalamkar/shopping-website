<div class="product-page">
  <div class="page-header">
    <h1>{{ pageTitle }}</h1>
    <button class="refine-button" (click)="toggleFilterSidebar()">⌘ REFINE</button>
  </div>

  <div class="product-content">
    <!-- Filter Sidebar -->
    <div class="filter-sidebar" [class.active]="isFilterSidebarOpen">
      <div class="filter-sidebar-header">
        <h3>Filters</h3>
        <button class="close-filter" (click)="toggleFilterSidebar()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <app-product-filter (filterChange)="applyFilters($any($event))"></app-product-filter>
    </div>

    <!-- Product Grid -->
    <div class="product-grid-container">
      <div class="product-grid">
        <div class="product-card" *ngFor="let product of products$ | async">
          <div class="product-image" (click)="viewProduct(product.id)">
            <img [src]="product.images[0]" [alt]="product.name" class="primary-image">
            <button class="wishlist-btn" (click)="toggleWishlist(product); $event.stopPropagation();" [class.active]="isInWishlist(product.id)">
              <mat-icon>{{ isInWishlist(product.id) ? 'favorite' : 'favorite_border' }}</mat-icon>
            </button>
          </div>
          <div class="product-info">
            <h3 class="product-title" (click)="viewProduct(product.id)">{{ product.name }}</h3>
            <p class="product-description">{{ product.description }}</p>
            <p class="product-price">₹{{ product.price | number:'1.2-2' }}</p>
            <div class="product-buttons">
              <button mat-button class="add-to-cart" (click)="addToCart(product)" [disabled]="!product.inStock">
                {{ product.inStock ? 'Add to Cart' : 'Out of Stock' }}
              </button>
              <button mat-button class="view-product" (click)="viewProduct(product.id)">
                View Details
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="no-products" *ngIf="(products$ | async)?.length === 0">
        <mat-icon>inventory_2</mat-icon>
        <p>No products found</p>
      </div>
    </div>
  </div>

  <!-- Overlay for mobile filter -->
  <div class="filter-overlay" *ngIf="isFilterSidebarOpen" (click)="toggleFilterSidebar()"></div>
</div>
