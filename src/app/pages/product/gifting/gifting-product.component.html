<div class="product-page">
  <div class="page-header">
    <h1>{{ pageTitle }}</h1>
    <button class="refine-button" (click)="toggleFilterSidebar()">⌘ REFINE</button>
  </div>

  <div class="product-content">
    <!-- Filter Sidebar -->
    <div class="filter-sidebar" [class.active]="isFilterSidebarOpen">
      <div class="filter-sidebar-header">
        <h3>Filters</h3>
        <button class="close-filter" (click)="toggleFilterSidebar()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <app-product-filter (filterChange)="applyFilters($any($event))"></app-product-filter>
    </div>

    <!-- Product Grid -->
    <div class="product-grid-container">
      <div class="product-grid">
        <div class="product-card" *ngFor="let product of products$ | async">
          <div class="product-image">
            <img [src]="product.imageUrl" [alt]="product.name" class="primary-image">
            <button class="wishlist-btn" (click)="toggleWishlist(product)" [class.active]="isInWishlist(product.id)">
              <mat-icon>{{ isInWishlist(product.id) ? 'favorite' : 'favorite_border' }}</mat-icon>
            </button>
          </div>
          <div class="product-info">
            <h3 class="product-title">{{ product.name }}</h3>
            <div class="product-rating">
              <mat-icon *ngFor="let star of [].constructor(product.rating)" class="star-icon">star</mat-icon>
              <mat-icon *ngFor="let star of [].constructor(5-product.rating)" class="star-icon empty">star_border</mat-icon>
              <span class="rating-count">({{ product.ratingCount }})</span>
            </div>
            <p class="product-price">₹{{ product.price | number:'1.2-2' }}</p>
          </div>
        </div>
      </div>

      <div class="no-products" *ngIf="(products$ | async)?.length === 0">
        <mat-icon>inventory_2</mat-icon>
        <p>No products found</p>
      </div>
    </div>
  </div>

  <!-- Overlay for mobile filter -->
  <div class="filter-overlay" *ngIf="isFilterSidebarOpen" (click)="toggleFilterSidebar()"></div>
</div>
