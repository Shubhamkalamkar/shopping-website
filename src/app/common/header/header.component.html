<header id="top" class="sticky top-0 z-50 w-full bg-black text-white shadow-lg">
  <!-- Announcement Bar -->
  <div class="bg-accent py-2 px-4 text-center text-white text-sm">
    <div class="container-custom">
      <div class="flex items-center justify-center">
        <span class="inline-flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
          Free shipping on all orders over $100
        </span>
        <span class="mx-4 hidden md:inline">|</span>
        <a href="/sale" class="hidden md:inline-flex items-center hover:underline">
          Summer sale: Up to 50% off
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </a>
      </div>
    </div>
  </div>
  
  <!-- Main Navigation Container -->
  <nav class="relative py-4" aria-label="Global">
    <div class="container-custom">
      <div class="flex items-center justify-between">
        <!-- Mobile Menu Button -->
        <div class="flex items-center lg:hidden">
          <button 
            type="button" 
            class="p-2 text-white hover:text-accent transition-colors focus:outline-none" 
            (click)="toggleMobileMenu()"
            aria-label="Toggle navigation"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>

        <!-- Logo Section -->
        <div class="flex items-center justify-center lg:justify-start">
          <a routerLink="/" class="flex items-center space-x-3">
            <!-- Brand Logo -->
            <div class="w-12 h-12 bg-accent rounded-sm flex items-center justify-center">
              <svg viewBox="0 0 100 100" class="w-8 h-8 fill-current text-white">
                <path d="M50 5L95 30L85 85L50 95L15 85L5 30L50 5ZM50 20L20 35L25 70L50 80L75 70L80 35L50 20ZM50 35L65 45L60 65L50 70L40 65L35 45L50 35Z"/>
              </svg>
            </div>
            <!-- Brand Name -->
            <h1 class="text-2xl font-bold tracking-wider uppercase font-heading">AHARON BETH </h1>
          </a>
        </div>

        <!-- Desktop Navigation Links -->
        <div class="hidden lg:flex lg:items-center lg:justify-center lg:gap-8">
          <a routerLink="/products/men" class="text-sm font-medium uppercase tracking-wider hover:text-accent transition-colors duration-300 py-2 border-b-2 border-transparent hover:border-accent">Men</a>
          <a routerLink="/products/women" class="text-sm font-medium uppercase tracking-wider hover:text-accent transition-colors duration-300 py-2 border-b-2 border-transparent hover:border-accent">Women</a>
          <a routerLink="/products/kids" class="text-sm font-medium uppercase tracking-wider hover:text-accent transition-colors duration-300 py-2 border-b-2 border-transparent hover:border-accent">Kids</a>
          <a routerLink="/products/accessories" class="text-sm font-medium uppercase tracking-wider hover:text-accent transition-colors duration-300 py-2 border-b-2 border-transparent hover:border-accent">Accessories</a>
          <a routerLink="/products/gifting" class="text-sm font-medium uppercase tracking-wider hover:text-accent transition-colors duration-300 py-2 border-b-2 border-transparent hover:border-accent">Gifting</a>
        </div>

        <!-- User Actions -->
        <div class="flex items-center gap-3">
          <!-- Search Button -->
          <button 
            type="button" 
            class="p-2 text-white rounded-full hover:bg-gray-800 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-accent" 
            aria-label="Search"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
          
          <!-- Account Button -->
          <button 
            type="button" 
            class="p-2 text-white rounded-full hover:bg-gray-800 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-accent" 
            routerLink="/account" 
            aria-label="Account"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </button>
          
          <!-- Wishlist Button -->
          <button 
            type="button" 
            class="p-2 text-white rounded-full hover:bg-gray-800 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-accent" 
            routerLink="/wishlist" 
            aria-label="Wishlist"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
            </svg>
          </button>
          
          <!-- Cart Button with Badge -->
          <button 
            type="button" 
            class="p-2 text-white rounded-full hover:bg-gray-800 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-accent relative" 
            routerLink="/cart" 
            aria-label="Cart"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
            </svg>
            <span class="absolute -top-1 -right-1 inline-flex items-center justify-center w-4 h-4 text-xs font-bold text-white bg-accent rounded-full">3</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu (Hidden by default) -->
  <div class="lg:hidden" [class.hidden]="!isMobileMenuOpen">
    <div class="container-custom">
      <div class="py-4 space-y-2 bg-black border-t border-gray-800">
        <!-- Navigation Links -->
        <div class="space-y-2 mb-4">
          <h3 class="text-xs font-semibold uppercase text-gray-400 px-3 mb-2">Shop Categories</h3>
          <a routerLink="/products/men" class="flex items-center px-3 py-2.5 text-sm font-medium uppercase tracking-wide hover:text-accent transition-colors hover:bg-gray-900 rounded-lg">
            <span>Men</span>
            <svg class="w-4 h-4 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </a>
          <a routerLink="/products/women" class="flex items-center px-3 py-2.5 text-sm font-medium uppercase tracking-wide hover:text-accent transition-colors hover:bg-gray-900 rounded-lg">
            <span>Women</span>
            <svg class="w-4 h-4 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </a>
          <a routerLink="/products/kids" class="flex items-center px-3 py-2.5 text-sm font-medium uppercase tracking-wide hover:text-accent transition-colors hover:bg-gray-900 rounded-lg">
            <span>Kids</span>
            <svg class="w-4 h-4 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </a>
          <a routerLink="/products/accessories" class="flex items-center px-3 py-2.5 text-sm font-medium uppercase tracking-wide hover:text-accent transition-colors hover:bg-gray-900 rounded-lg">
            <span>Accessories</span>
            <svg class="w-4 h-4 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </a>
          <a routerLink="/products/gifting" class="flex items-center px-3 py-2.5 text-sm font-medium uppercase tracking-wide hover:text-accent transition-colors hover:bg-gray-900 rounded-lg">
            <span>Gifting</span>
            <svg class="w-4 h-4 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </a>
        </div>
        
        <!-- Quick Links -->
        <div class="border-t border-gray-800 pt-4">
          <h3 class="text-xs font-semibold uppercase text-gray-400 px-3 mb-2">Quick Links</h3>
          <div class="grid grid-cols-2 gap-2">
            <a href="/account" class="px-3 py-2 text-sm text-gray-300 hover:text-white transition-colors">
              <span>My Account</span>
            </a>
            <a href="/orders" class="px-3 py-2 text-sm text-gray-300 hover:text-white transition-colors">
              <span>Orders</span>
            </a>
            <a href="/wishlist" class="px-3 py-2 text-sm text-gray-300 hover:text-white transition-colors">
              <span>Wishlist</span>
            </a>
            <a href="/help" class="px-3 py-2 text-sm text-gray-300 hover:text-white transition-colors">
              <span>Help Center</span>
            </a>
          </div>
        </div>
        
        <!-- Contact & Social -->
        <div class="border-t border-gray-800 pt-4 mt-4">
          <div class="flex flex-col space-y-4 px-3">
            <p class="text-sm text-gray-400">Need assistance? Contact us:</p>
            <a href="tel:+1234567890" class="text-sm text-white hover:text-accent transition-colors inline-flex items-center">
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
              </svg>
              +1 (234) 567-890
            </a>
            <div class="flex space-x-4 mt-2">
              <a href="#" class="text-gray-400 hover:text-white transition-colors">
                <span class="sr-only">Facebook</span>
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" clip-rule="evenodd"></path>
                </svg>
              </a>
              <a href="#" class="text-gray-400 hover:text-white transition-colors">
                <span class="sr-only">Instagram</span>
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.45 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clip-rule="evenodd"></path>
                </svg>
              </a>
              <a href="#" class="text-gray-400 hover:text-white transition-colors">
                <span class="sr-only">Twitter</span>
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 012.8 9.713v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84"></path>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
